services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: packaging_ai
      MYSQL_USER: packaging
      MYSQL_PASSWORD: packaging
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_auth.sql:/docker-entrypoint-initdb.d/002_auth.sql:ro
      - ./migrations/004_design_fusion.sql:/docker-entrypoint-initdb.d/004_design_fusion.sql:ro
      - ./migrations/005_product_name.sql:/docker-entrypoint-initdb.d/005_product_name.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "packaging:packaging@tcp(mysql:3306)/packaging_ai?parseTime=true&charset=utf8mb4&loc=Local"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_QUEUE: "packaging-ai"
      REDIS_CONCURRENCY: "4"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:?LLM_API_KEY must be set for production mode}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      IMAGE_BASE_URL: "${IMAGE_BASE_URL:-}"
      IMAGE_API_KEY: "${IMAGE_API_KEY:-}"
      IMAGE_MODEL: "${IMAGE_MODEL:-gpt-image-1}"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set for production mode}"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q 'ok'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
